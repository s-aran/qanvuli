[package]
name = "sucve-core"
version = "0.1.0"
edition = "2024"

[dependencies]
ahash = "0.8.12"
anyhow = "1.0.100"
async_zip = { version = "0.0.18", features = ["chrono", "deflate", "tokio"] }
chrono = { version = "0.4.42", features = ["serde"] }
glob = "0.3.3"
octocrab = { version = "0.48.1", features = ["rustls", "stream"] }
once_cell = "1.21.3"
regex = "1.12.2"
reqwest = { version = "0.12.24", features = [
    "blocking",
    "rustls-tls",
    "stream",
] }
sea-orm = { version = "1.1.19", features = [
    "chrono",
    "runtime-tokio-rustls",
    "serde_json",
    "sqlx-sqlite",
    "with-uuid",
] }
serde = { version = "1.0.228", features = ["derive", "serde_derive"] }
serde_json = "1.0.145"
serde_valid = { version = "2.0.0", features = ["toml"] }
simd-json = { version = "0.17.0", features = ["ahash"] }
strum = { version = "0.27.2", features = ["derive"] }
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["rt-multi-thread"] }
toml = { version = "0.9.8", features = ["fast_hash"] }

[lib]
doctest = false

[profile.release]
opt-level = 3
debug = false
rpath = false
lto = "fat"
debug-assertions = false
codegen-units = 1
strip = true
panic = 'abort'
incremental = false
overflow-checks = false

[package]
name = "qanvuli-app-commands"
edition.workspace = true
version.workspace = true

[dependencies]
qanvuli-collector = { version = "*", path = "../../../collector" }
qanvuli-db = { version = "*", path = "../../../db" }
qanvuli-models = { version = "*", path = "../../../models" }
qanvuli-utils = { version = "*", path = "../../../utils" }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.6", features = ["derive"] }
rayon = "1.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
simd-json = { version = "0.17.0", features = ["ahash"] }
url = "2"

[package]
name = "qanvuli-app-commands"
edition.workspace = true
version.workspace = true
license.workspace = true

[features]
default = ["enrichment"]
enrichment = ["qanvuli-db/enrichment"]

[dependencies]
qanvuli-collector = { version = "*", path = "../../../collector" }
qanvuli-db = { version = "*", path = "../../../db", default-features = false }
qanvuli-models = { version = "*", path = "../../../models" }
qanvuli-utils = { version = "*", path = "../../../utils" }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.6", features = ["derive"] }
rayon = "1.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
simd-json = { version = "0.17", features = ["ahash"] }
url = "2"
zip = { version = "8.6", default-features = false, features = ["deflate"] }

[dev-dependencies]
tokio = { version = "1.52", features = ["macros", "rt-multi-thread"] }

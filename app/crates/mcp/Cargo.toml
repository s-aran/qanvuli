[package]
name = "qanvuli-app-mcp"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
qanvuli-app-commands = { version = "*", path = "../commands" }
qanvuli-core = { version = "*", path = "../../../core" }
rmcp = { version = "2.2", features = ["server", "transport-io"] }
serde = { version = "1.0", features = ["derive"] }
simd-json = { version = "0.17", features = ["ahash"] }
tokio = { version = "1.53", features = ["io-std", "macros", "rt", "sync"] }

[package]
name = "qanvuli-app-mcp"
edition.workspace = true
version.workspace = true
license.workspace = true

[features]
default = ["enrichment"]
enrichment = ["qanvuli-app-commands/enrichment", "qanvuli-core/enrichment"]

[dependencies]
qanvuli-app-commands = { version = "*", path = "../commands", default-features = false }
qanvuli-core = { version = "*", path = "../../../core", default-features = false }
rmcp = { version = "2.1", features = ["server", "transport-io"] }
serde = { version = "1.0", features = ["derive"] }
simd-json = { version = "0.17", features = ["ahash"] }
tokio = { version = "1.52", features = ["io-std", "macros", "rt", "sync"] }

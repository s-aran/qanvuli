[package]
name = "qanvuli-app-tui"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
qanvuli-app-commands = { version = "*", path = "../commands" }
qanvuli-core = { version = "*", path = "../../../core" }
qanvuli-utils = { version = "*", path = "../../../utils" }
chrono = "0.4"
clap = { version = "4.6", features = ["derive"] }
crossterm = "0.29"
html2text = "0.17"
ratada = "0.5"
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
regex = "1.13"
serde_json = "1"
tokio = { version = "1.53", features = ["rt", "sync"] }

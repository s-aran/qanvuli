[package]
name = "qanvuli-collector"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
flate2 = "1.1"
futures = "0.3"
object_store = { version = "0.13", features = ["gcp"] }
reqwest = { version = "0.13", features = [
    "rustls",
    "stream",
], default-features = false }
tokio = { version = "1.52", features = ["fs", "io-util"] }
url = "2"
qanvuli-models = { version = "*", path = "../models" }
qanvuli-utils = { version = "*", path = "../utils" }

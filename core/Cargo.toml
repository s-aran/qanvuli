[package]
name = "qanvuli-core"
version = "0.1.2"
edition = "2024"
license = "MIT"

[dependencies]
ahash = "0.8"
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
once_cell = "1.21"
serde = { version = "1.0", features = ["derive", "serde_derive"] }
serde_json = "1.0"
serde_valid = { version = "2.0", features = ["toml"] }
simd-json = { version = "0.17", features = ["ahash"] }
strum = { version = "0.28", features = ["derive"] }
thiserror = "2.0"
toml = { version = "1.1", features = ["fast_hash"] }

qanvuli-models = { version = "*", path = "../models" }
qanvuli-utils = { version = "*", path = "../utils" }
qanvuli-collector = { version = "*", path = "../collector" }
qanvuli-db = { version = "*", path = "../db" }

[lib]
doctest = false

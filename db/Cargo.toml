[package]
name = "qanvuli-db"
version = "0.1.0"
edition = "2024"

[dependencies]
ahash = "0.8.12"
anyhow = "1.0.100"
chrono = { version = "0.4.42", features = ["serde"] }
once_cell = "1.21.3"
regex = "1.12.2"
sea-orm = { version = "1.1.19", features = [
    "chrono",
    "runtime-tokio-rustls",
    "serde_json",
    "sqlx-sqlite",
    "with-uuid",
] }
sea-orm-migration = { version = "1.1.19", features = [
    "runtime-tokio-rustls",
    "sqlx-sqlite",
] }
serde = { version = "1.0.228", features = ["derive", "serde_derive"] }
serde_json = "1.0.145"
simd-json = { version = "0.17.0", features = ["ahash"] }
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["rt-multi-thread"] }

qanvuli-models = { version = "*", path = "../models" }
qanvuli-utils = { version = "*", path = "../utils" }

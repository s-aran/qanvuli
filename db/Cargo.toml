[package]
name = "qanvuli-db"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
md5 = { package = "md-5", version = "0.11" }
once_cell = "1.21"
regex = "1.12"
sea-orm = { version = "1.1", features = [
    "chrono",
    "runtime-tokio",
    "serde_json",
    "sqlx-sqlite",
    "sqlite-use-returning-for-3_35",
    "with-uuid",
] }
sea-orm-migration = { version = "1.1", features = [
    "runtime-tokio",
    "sqlx-sqlite",
] }
serde = { version = "1.0", features = ["derive", "serde_derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.52", features = ["rt-multi-thread"] }

qanvuli-models = { version = "*", path = "../models" }
qanvuli-utils = { version = "*", path = "../utils" }

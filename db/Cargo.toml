[package]
name = "qanvuli-db"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
anyhow = "1.0"
ahash = "0.8"
chrono = { version = "0.4", features = ["serde"] }
md5 = { package = "md-5", version = "0.11" }
once_cell = "1.21"
regex = "1.13"
rayon = "1.12"
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
    "sqlite",
    "chrono",
    "derive",
] }
serde = { version = "1.0", features = ["derive", "serde_derive"] }
serde_json = "1.0"
semver = { version = "1.0", features = ["serde"] }
pep440_rs = "0.7"
simd-json = { version = "0.17", features = ["ahash"] }
thiserror = "2.0"
tokio = { version = "1.53", features = ["macros", "rt-multi-thread"] }
tracing = "0.1"

qanvuli-models = { version = "*", path = "../models" }
qanvuli-utils = { version = "*", path = "../utils" }

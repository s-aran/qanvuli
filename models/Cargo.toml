[package]
name = "qanvuli-models"
version = "0.1.0"
edition = "2024"

[dependencies]
ahash = "0.8"
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
once_cell = "1.21"
serde = { version = "1.0", features = ["derive", "serde_derive"] }
strum = { version = "0.28", features = ["derive"] }
thiserror = "2.0"

qanvuli-utils = { version = "*", path = "../utils" }
serde_json = "1.0"
simd-json = "0.17"

[lib]
doctest = false


[dev-dependencies]
glob = "0.3.3"
serde_json = "1.0.149"

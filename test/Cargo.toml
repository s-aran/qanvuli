[package]
name = "qanvuli-test"
edition.workspace = true
version.workspace = true

[dependencies]
# qanvuli-core = { version = "*", path = "../core" }
qanvuli-collector = { version = "*", path = "../collector" }
qanvuli-db = { version = "*", path = "../db" }
qanvuli-utils = { version = "*", path = "../utils" }
qanvuli-models = { version = "*", path = "../models" }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5.53", features = ["derive"] }
rayon = "1.11"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tokio = { version = "1.52.3", features = ["rt"] }

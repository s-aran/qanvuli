[package]
name = "qanvuli-test"
edition.workspace = true
version.workspace = true

[dependencies]
# qanvuli-core = { version = "*", path = "../core" }
qanvuli-collector = { version = "*", path = "../collector" }
qanvuli-db = { version = "*", path = "../db" }
qanvuli-utils = { version = "*", path = "../utils" }
qanvuli-models = { version = "*", path = "../models" }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.6", features = ["derive"] }
crossterm = "0.29"
ratatui = "0.30"
rayon = "1.12"
rmcp = { version = "1.7", features = ["server", "transport-io"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

tokio = { version = "1.52", features = ["io-std", "macros", "rt", "sync"] }
simd-json = { version = "0.17.0", features = ["ahash"] }
